services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleetip
      POSTGRES_PASSWORD: fleetip
      POSTGRES_DB: fleetip
    # Mapped to 5433, not the default 5432 — another project's Postgres
    # container is already using 5432 on this machine.
    ports:
      - "5433:5432"
    volumes:
      - fleetip-postgres-data:/var/lib/postgresql/data

volumes:
  fleetip-postgres-data:
